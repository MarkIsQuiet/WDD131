
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Form</title>
  <link rel="icon" href="falavicon.png">
  <link rel="stylesheet" href="eventform.css" />
  <script src="eventform.js" defer></script>
</head>
<body>
    <main class="wrapper">
        <h1>Event Form</h1>

        <form id="fsyForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required />
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
                <label for="accessType">Type</label>
                <select
                id="accessType"                
                name="accessType"
                aria-controls="notesContainer"
                required
                >
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="availableDate">Available Start Date</label>
                <input id="availableDate" name="availableDate" type="date" required />
            </div>

            <div id="studentIDRequest" class="field full" hidden>
                <label for="studentID">Student ID</label>
                <input id="studentID" name="studentID" type="text" />
            </div>

            <div id="accessCodeRequest" class="field full" hidden>
                <label for="accessCode">Access Code</label>
                <input id="accessCode" name="accessCode" type="text" />
            </div>

            <button class="full" type="submit">Submit Preferences</button>
        </form>

        <section id="output" aria-live="polite"></section>

    </main>
</body>
</html>
